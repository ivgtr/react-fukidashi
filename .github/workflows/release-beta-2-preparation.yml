name: Prepare beta.2 metadata
on:
  push:
    branches: [fix/release-beta-2]
    paths: [.github/workflows/release-beta-2-preparation.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ivgtr/react-fukidashi' && github.ref == 'refs/heads/fix/release-beta-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check availability and update only version metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          const next = '2.0.0-beta.2';
          const tag = spawnSync('git', ['ls-remote', '--exit-code', '--tags', 'origin', `refs/tags/v${next}`], { encoding: 'utf8' });
          if (tag.error) throw tag.error;
          assert.equal(tag.status, 2, `Tag v${next} already exists or could not be checked: ${tag.stderr}`);
          const response = await fetch('https://registry.npmjs.org/react-fukidashi', { signal: AbortSignal.timeout(30000) });
          assert.equal(response.status, 200, 'Cannot verify npm package metadata');
          const metadata = await response.json();
          assert.ok(metadata.versions && typeof metadata.versions === 'object');
          assert.ok(!Object.hasOwn(metadata.versions, next), `${next} is already published`);
          console.log(JSON.stringify({ publishedVersions: Object.keys(metadata.versions), distTags: metadata['dist-tags'], next }, null, 2));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.version, '2.0.0-beta.0');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          execFileSync('npm', ['version', next, '--no-git-tag-version', '--ignore-scripts'], { stdio: 'inherit' });
          pkg.version = next;
          lock.version = next;
          lock.packages[''].version = next;
          assert.deepEqual(JSON.parse(readFileSync('package.json', 'utf8')), pkg);
          assert.deepEqual(JSON.parse(readFileSync('package-lock.json', 'utf8')), lock);
          console.log('Only the three project-version fields changed; dependencies are unchanged.');
          NODE
      - name: Commit version metadata to the fix branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: align package and lockfile versions at 2.0.0-beta.2'
          git push origin HEAD:fix/release-beta-2
