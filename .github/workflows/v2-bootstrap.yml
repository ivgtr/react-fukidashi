# Temporary, branch-scoped bootstrap. Removed once the new lockfile is committed.
name: Bootstrap v2 validation
on:
  push:
    branches: [refactor/fukidashi-v2]
permissions:
  contents: read
jobs:
  lock:
    if: github.repository == 'ivgtr/react-fukidashi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fukidashi-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run format
      - name: Commit the generated lockfile and formatting to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock v2 dependencies and format the rebuild'
            git push origin HEAD:refactor/fukidashi-v2
          fi
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-bootstrap-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
