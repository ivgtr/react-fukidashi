name: Prepare v2 review snapshot
on:
  push:
    branches: [release/v2-stable]
    paths: [.github/workflows/v2-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Archive only tracked sources and installed dependencies
        run: |
          git archive HEAD -o "$RUNNER_TEMP/review-source.tar"
          tar -rf "$RUNNER_TEMP/review-source.tar" node_modules
          gzip "$RUNNER_TEMP/review-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: ${{ runner.temp }}/review-source.tar.gz
          retention-days: 1
